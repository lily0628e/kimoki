<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형-기초</title>
    <style>
        *{margin: 0; padding: 0;}
        ul{list-style: none;}
        a{text-decoration: none; color: inherit;}
        a:hover{color:pink}

        header{
            width: 1000px;
            height: 50px;
            line-height: 50px;
            margin: 0 auto;
            background-color: rgb(127, 182, 182);
            color: aliceblue;
        }
        .gnb{
            display: flex;
            justify-content: space-around;
        }
        main{
            width: 1000px;
            margin: 0 auto;
            background-color: rgb(157, 194, 216);
        }
        .contents{
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px;
        }
        .contents>li{
            width: 320px;
            height: 300px;
            line-height: 300px;
            background-color: rgb(206, 157, 216);
            /* font-size: 4rem; */
            font-size: clamp(30pt, 4vw, 60pt);
            color: aliceblue;
            text-align: center;
        }
        footer{
            width: 1000px;
            height: 50px;
            line-height: 50px;
            margin: 0 auto;
            background-color: rgb(221, 175, 213);
            color: aliceblue;
            text-align: center;
        }
        
        @media (max-width:768px){
            header{
                width: 90%;
                background-color: rgb(88, 180, 180);
            }
            main{
                width: 90%;
                background-color: rgb(94, 127, 146);
            }
            .contents{
                gap: 1%;
                padding: 1%;
            }
            .contents>li{
                width: 49.5%;
                margin-bottom: 1%;
                background-color: rgb(185, 129, 139);
            }
            .contents>li:nth-child(5),
            .contents>li:nth-child(6){
                display: none;
            }
            footer{
                width: 90%;
                background-color: rgb(88, 180, 180);
            }
        }
        @media (max-width:360px){
            header{
                width: 100%;
                height: 200px;
                background-color: rgb(228, 182, 230);
            }
            .gnb{
                flex-direction: column;
            }
            .gnb>li{
                height: 50px;
                background-color: rgb(223, 197, 228);
                text-align: center;
                border-bottom: 1px solid #fcfcfc;
                box-sizing: border-box;
            }
            main{
                width: 100%;
                background-color: rgb(180, 163, 184);
            }
            .contents{
                display: block;
                padding: 2%;
            }
            .contents>li{
                width: 99.8%;
                background-color: rgb(155, 108, 165);
            }
            .contents>li:nth-child(odd){
                display: none;
            }
            .contents>li:nth-child(6){
                display: block;
            }
            footer{
                width: 100%;
                background-color: rgb(228, 182, 230);
            }

        }

    </style>
</head>
<body>
    <header>
        <ul class="gnb">
            <li><a href="#">HOME</a></li>
            <li><a href="#">PROFILE</a></li>
            <li><a href="#">PORTFOLIO</a></li>
            <li><a href="#">GALLERY</a></li>
        </ul>
    </header>
    <main>
        <ul class="contents">
            <li>box01</li>
            <li>box02</li>
            <li>box03</li>
            <li>box04</li>
            <li>box05</li>
            <li>box06</li>
        </ul>
    </main>
    <footer>
        <div class="copyright">2026 songE. All Rights Reserved.</div>
    </footer>
</body>
</html>
